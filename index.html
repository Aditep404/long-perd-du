<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>setting — insert</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #19081c;
}

body {
    font-family: "Noto Sans Thai", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}

#message {
    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(0.55);

    color: white;

    font-family:
        "Noto Sans Thai",
        sans-serif;

    font-size: clamp(
        48px,
        8vw,
        88px
    );

    font-weight: 700;

    text-shadow:
        0 0 5px rgba(255, 100, 150, 0.9),
        0 0 15px rgba(255, 50, 120, 0.8),
        0 0 30px rgba(255, 30, 100, 0.7);

    opacity: 0;

    pointer-events: none;

    white-space: nowrap;

    transition:
        transform 0.65s cubic-bezier(
            0.175,
            0.885,
            0.32,
            1.275
        ),
        opacity 0.25s ease;
}

#message.show {
    opacity: 1;

    transform:
        translate(-50%, -50%)
        scale(1);
}

#hint {
    position: fixed;

    left: 50%;
    bottom: 24px;

    transform: translateX(-50%);

    color: rgba(
        255,
        220,
        235,
        0.72
    );

    font-family:
        "Noto Sans Thai",
        sans-serif;

    font-size: 15px;

    letter-spacing: 1px;

    white-space: nowrap;

    pointer-events: none;
}

</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="message">
    หวาน
</div>

<div id="hint">
    คลิกหัวใจ  •  LOVE
</div>


<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const message =
    document.getElementById("message");


/* =========================================================
   GLOBAL
========================================================= */

let width = 0;
let height = 0;

let centerX = 0;
let centerY = 0;

let particles = [];
let floatingHearts = [];
let ripples = [];

let pulseTime = 0;

let clickBoost = 0;

let lastTime = performance.now();

let spawnTimer = 0;


/* =========================================================
   COLORS
========================================================= */

const COLORS = {

    bgTop: [
        25,
        8,
        28
    ],

    bgBottom: [
        91,
        16,
        58
    ],

    heartDark: [
        145,
        8,
        50
    ],

    heartMain: [
        255,
        30,
        85
    ],

    heartLight: [
        255,
        100,
        150
    ],

    pink1: [
        255,
        55,
        110
    ],

    pink2: [
        255,
        100,
        150
    ],

    pink3: [
        255,
        165,
        195
    ],

    pink4: [
        255,
        220,
        235
    ]

};


/* =========================================================
   RESIZE
========================================================= */

function resize() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    centerX =
        width / 2;

    centerY =
        height / 2;

}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   UTILITIES
========================================================= */

function clamp(
    value,
    min = 0,
    max = 1
) {

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}


function lerp(
    a,
    b,
    t
) {

    return (
        a +
        (b - a) * t
    );

}


function easeOutCubic(t) {

    t =
        clamp(t);

    return (
        1 -
        Math.pow(
            1 - t,
            3
        )
    );

}


/* =========================================================
   HEART SHAPE
========================================================= */

function heartPoint(
    t,
    scale
) {

    const x =
        16 *
        Math.pow(
            Math.sin(t),
            3
        );

    const y =
        13 *
            Math.cos(t)
        - 5 *
            Math.cos(2 * t)
        - 2 *
            Math.cos(3 * t)
        - Math.cos(4 * t);

    return {

        x:
            centerX +
            x * scale,

        y:
            centerY -
            y * scale

    };

}


/* =========================================================
   DRAW HEART
========================================================= */

function drawHeart(
    x,
    y,
    scale,
    color,
    alpha = 1
) {

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.beginPath();

    const points = 100;

    for (
        let i = 0;
        i <= points;
        i++
    ) {

        const t =
            (i / points) *
            Math.PI *
            2;

        const px =
            16 *
            Math.pow(
                Math.sin(t),
                3
            ) *
            scale;

        const py =
            -(
                13 *
                Math.cos(t)
                - 5 *
                Math.cos(2 * t)
                - 2 *
                Math.cos(3 * t)
                - Math.cos(4 * t)
            ) *
            scale;

        if (i === 0) {

            ctx.moveTo(
                px,
                py
            );

        } else {

            ctx.lineTo(
                px,
                py
            );

        }

    }

    ctx.closePath();

    ctx.globalAlpha =
        alpha;

    ctx.fillStyle =
        color;

    ctx.fill();

    ctx.restore();

}


/* =========================================================
   HEARTBEAT
========================================================= */

function heartbeatScale() {

    const cycle =
        pulseTime %
        1.35;

    let beat = 0;

    if (
        cycle < 0.16
    ) {

        const t =
            cycle / 0.16;

        beat =
            Math.sin(
                Math.PI * t
            );

    }

    else if (
        cycle < 0.34
    ) {

        const t =
            (
                cycle -
                0.16
            ) / 0.18;

        beat =
            Math.sin(
                Math.PI * t
            ) *
            0.55;

    }

    return (
        8.6 +
        beat * 0.95 +
        clickBoost
    );

}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground() {

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            height
        );

    gradient.addColorStop(
        0,
        "rgb(25,8,28)"
    );

    gradient.addColorStop(
        1,
        "rgb(91,16,58)"
    );

    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* Large atmospheric glow */

    const glow =
        ctx.createRadialGradient(
            centerX,
            centerY,
            10,
            centerX,
            centerY,
            320
        );

    glow.addColorStop(
        0,
        "rgba(255,20,90,0.14)"
    );

    glow.addColorStop(
        0.5,
        "rgba(255,20,90,0.05)"
    );

    glow.addColorStop(
        1,
        "rgba(255,20,90,0)"
    );

    ctx.fillStyle =
        glow;

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* Fixed stars */

    const random =
        createSeededRandom(
            2026
        );

    for (
        let i = 0;
        i < 110;
        i++
    ) {

        const x =
            random() *
            width;

        const y =
            random() *
            height;

        const size =
            random() <
            0.8
                ? 1
                : 2;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "rgba(255,190,215,0.35)";

        ctx.fill();

    }

}


/* =========================================================
   SEEDED RANDOM
========================================================= */

function createSeededRandom(
    seed
) {

    return function() {

        seed =
            (
                seed *
                1664525 +
                1013904223
            ) %
            4294967296;

        return (
            seed /
            4294967296
        );

    };

}


/* =========================================================
   MAIN HEART
========================================================= */

function drawMainHeart() {

    const scale =
        heartbeatScale();


    /* Outer glow */

    const glow1 =
        ctx.createRadialGradient(
            centerX,
            centerY,
            10,
            centerX,
            centerY,
            210
        );

    glow1.addColorStop(
        0,
        "rgba(255,20,90,0.20)"
    );

    glow1.addColorStop(
        0.5,
        "rgba(255,20,90,0.08)"
    );

    glow1.addColorStop(
        1,
        "rgba(255,20,90,0)"
    );

    ctx.fillStyle =
        glow1;

    ctx.fillRect(
        centerX - 230,
        centerY - 230,
        460,
        460
    );


    /* Outer heart */

    drawHeart(
        centerX,
        centerY,
        scale * 1.08,
        "rgb(145,8,50)"
    );


    /* Main heart */

    drawHeart(
        centerX,
        centerY,
        scale,
        "rgb(255,30,85)"
    );


    /* Highlight */

    drawHeart(
        centerX - 1.5,
        centerY - 3,
        scale * 0.86,
        "rgba(255,100,150,0.35)"
    );


    /* Outline */

    ctx.save();

    ctx.beginPath();

    const points = 160;

    for (
        let i = 0;
        i <= points;
        i++
    ) {

        const t =
            (i / points) *
            Math.PI *
            2;

        const px =
            centerX +
            16 *
            Math.pow(
                Math.sin(t),
                3
            ) *
            scale;

        const py =
            centerY -
            (
                13 *
                Math.cos(t)
                - 5 *
                Math.cos(2 * t)
                - 2 *
                Math.cos(3 * t)
                - Math.cos(4 * t)
            ) *
            scale;

        if (i === 0) {

            ctx.moveTo(
                px,
                py
            );

        } else {

            ctx.lineTo(
                px,
                py
            );

        }

    }

    ctx.closePath();

    ctx.strokeStyle =
        "rgba(255,160,190,0.8)";

    ctx.lineWidth = 2;

    ctx.stroke();

    ctx.restore();

}


/* =========================================================
   PARTICLE CLASS
========================================================= */

class Particle {

    constructor(
        x,
        y,
        vx,
        vy,
        size,
        color,
        lifetime,
        spark = false
    ) {

        this.x = x;
        this.y = y;

        this.vx = vx;
        this.vy = vy;

        this.size = size;

        this.color = color;

        this.life =
            lifetime;

        this.maxLife =
            lifetime;

        this.rotation =
            Math.random() *
            Math.PI *
            2;

        this.rotationSpeed =
            (
                Math.random() *
                8 -
                4
            );

        this.gravity =
            10 +
            Math.random() *
            30;

        this.spark =
            spark;

    }


    update(dt) {

        this.life -=
            dt;

        this.x +=
            this.vx *
            dt;

        this.y +=
            this.vy *
            dt;

        this.vy +=
            this.gravity *
            dt;

        this.rotation +=
            this.rotationSpeed *
            dt;

        if (this.spark) {

            this.vx *=
                1 -
                dt * 1.4;

            this.vy *=
                1 -
                dt * 1.4;

        }

    }


    draw() {

        if (
            this.life <= 0
        ) {
            return;
        }

        const alpha =
            clamp(
                this.life /
                this.maxLife
            );


        if (
            this.spark
        ) {

            const velocity =
                Math.sqrt(
                    this.vx *
                    this.vx +
                    this.vy *
                    this.vy
                );

            let dx = 1;
            let dy = 0;

            if (
                velocity > 0
            ) {

                dx =
                    this.vx /
                    velocity;

                dy =
                    this.vy /
                    velocity;

            }

            const length =
                this.size *
                2;

            ctx.beginPath();

            ctx.moveTo(
                this.x,
                this.y
            );

            ctx.lineTo(
                this.x +
                dx * length,
                this.y +
                dy * length
            );

            ctx.strokeStyle =
                `rgba(
                    255,
                    235,
                    245,
                    ${alpha}
                )`;

            ctx.lineWidth =
                Math.max(
                    1,
                    this.size
                );

            ctx.stroke();

            return;

        }


        ctx.save();

        ctx.translate(
            this.x,
            this.y
        );

        ctx.rotate(
            this.rotation
        );

        ctx.globalAlpha =
            alpha;

        ctx.fillStyle =
            `rgb(
                ${this.color[0]},
                ${this.color[1]},
                ${this.color[2]}
            )`;

        ctx.beginPath();

        const points = 40;

        for (
            let i = 0;
            i <= points;
            i++
        ) {

            const t =
                (
                    i /
                    points
                ) *
                Math.PI *
                2;

            const px =
                16 *
                Math.pow(
                    Math.sin(t),
                    3
                ) *
                this.size /
                18;

            const py =
                -(
                    13 *
                    Math.cos(t)
                    - 5 *
                    Math.cos(2 * t)
                    - 2 *
                    Math.cos(3 * t)
                    - Math.cos(4 * t)
                ) *
                this.size /
                18;

            if (i === 0) {

                ctx.moveTo(
                    px,
                    py
                );

            } else {

                ctx.lineTo(
                    px,
                    py
                );

            }

        }

        ctx.closePath();

        ctx.fill();

        ctx.restore();

    }

}


/* =========================================================
   RIPPLE
========================================================= */

class Ripple {

    constructor() {

        this.x =
            centerX;

        this.y =
            centerY;

        this.time = 0;

        this.duration =
            0.75;

    }


    update(dt) {

        this.time +=
            dt;

    }


    draw() {

        const progress =
            clamp(
                this.time /
                this.duration
            );

        const radius =
            lerp(
                20,
                280,
                easeOutCubic(
                    progress
                )
            );

        const alpha =
            150 *
            (
                1 -
                progress
            );

        const lineWidth =
            Math.max(
                1,
                5 *
                (
                    1 -
                    progress
                )
            );

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            radius,
            0,
            Math.PI * 2
        );

        ctx.strokeStyle =
            `rgba(
                255,
                140,
                180,
                ${alpha / 255}
            )`;

        ctx.lineWidth =
            lineWidth;

        ctx.stroke();

    }


    get alive() {

        return (
            this.time <
            this.duration
        );

    }

}


/* =========================================================
   FLOATING HEART
========================================================= */

class FloatingHeart {

    constructor() {

        this.x =
            Math.random() *
            width;

        this.y =
            height +
            50 +
            Math.random() *
            100;

        this.speed =
            20 +
            Math.random() *
            50;

        this.wave =
            7 +
            Math.random() *
            21;

        this.phase =
            Math.random() *
            Math.PI *
            2;

        this.size =
            5 +
            Math.random() *
            9;

        this.time = 0;

        this.maxTime =
            8 +
            Math.random() *
            7;

        this.color =
            [
                COLORS.pink1,
                COLORS.pink2,
                COLORS.pink3,
                COLORS.pink4
            ][
                Math.floor(
                    Math.random() * 4
                )
            ];

    }


    update(dt) {

        this.time +=
            dt;

        this.y -=
            this.speed *
            dt;

        this.x +=
            Math.sin(
                this.time * 1.5 +
                this.phase
            ) *
            this.wave *
            dt;

    }


    draw() {

        if (
            this.time >
            this.maxTime
        ) {
            return;
        }

        const fadeIn =
            Math.min(
                1,
                this.time
            );

        const fadeOut =
            Math.min(
                1,
                (
                    this.maxTime -
                    this.time
                ) / 2
            );

        const alpha =
            0.31 *
            Math.min(
                fadeIn,
                fadeOut
            );

        drawSmallHeart(
            this.x,
            this.y,
            this.size,
            this.color,
            alpha
        );

    }


    get alive() {

        return (
            this.time <
            this.maxTime &&
            this.y >
            -80
        );

    }

}


/* =========================================================
   SMALL HEART
========================================================= */

function drawSmallHeart(
    x,
    y,
    size,
    color,
    alpha
) {

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.globalAlpha =
        alpha;

    ctx.fillStyle =
        `rgb(
            ${color[0]},
            ${color[1]},
            ${color[2]}
        )`;

    ctx.beginPath();

    const points = 40;

    for (
        let i = 0;
        i <= points;
        i++
    ) {

        const t =
            (
                i /
                points
            ) *
            Math.PI *
            2;

        const px =
            16 *
            Math.pow(
                Math.sin(t),
                3
            ) *
            size /
            18;

        const py =
            -(
                13 *
                Math.cos(t)
                - 5 *
                Math.cos(2 * t)
                - 2 *
                Math.cos(3 * t)
                - Math.cos(4 * t)
            ) *
            size /
            18;

        if (i === 0) {

            ctx.moveTo(
                px,
                py
            );

        } else {

            ctx.lineTo(
                px,
                py
            );

        }

    }

    ctx.closePath();

    ctx.fill();

    ctx.restore();

}


/* =========================================================
   LOVE BURST
========================================================= */

function createLoveBurst() {

    ripples.push(
        new Ripple()
    );


    /* Heart particles */

    for (
        let i = 0;
        i < 85;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;

        const speed =
            90 +
            Math.random() *
            290;

        const vx =
            Math.cos(angle) *
            speed;

        const vy =
            Math.sin(angle) *
            speed;

        const colors =
            [
                COLORS.pink1,
                COLORS.pink2,
                COLORS.pink3,
                COLORS.pink4,
                [255,245,250]
            ];

        const color =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];

        particles.push(
            new Particle(
                centerX,
                centerY,
                vx,
                vy,
                7 +
                    Math.random() *
                    13,
                color,
                0.8 +
                    Math.random() *
                    1.0
            )
        );

    }


    /* Spark particles */

    for (
        let i = 0;
        i < 30;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;

        const speed =
            180 +
            Math.random() *
            370;

        particles.push(
            new Particle(
                centerX,
                centerY,
                Math.cos(angle) *
                    speed,
                Math.sin(angle) *
                    speed,
                2 +
                    Math.random() *
                    3,
                [255,235,245],
                0.3 +
                    Math.random() *
                    0.5,
                true
            )
        );

    }


    /* Heartbeat boost */

    clickBoost =
        3.5;


    /* Text */

    message.classList.remove(
        "show"
    );

    void message.offsetWidth;

    message.classList.add(
        "show"
    );

}


/* =========================================================
   HIT TEST
========================================================= */

function isInsideHeart(
    x,
    y
) {

    const dx =
        x -
        centerX;

    const dy =
        y -
        centerY;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    return (
        distance <
        145
    );

}


/* =========================================================
   MOUSE
========================================================= */

canvas.addEventListener(
    "click",
    function(event) {

        if (
            isInsideHeart(
                event.clientX,
                event.clientY
            )
        ) {

            createLoveBurst();

        }

    }
);


/* =========================================================
   TOUCH
========================================================= */

canvas.addEventListener(
    "touchstart",
    function(event) {

        if (
            event.touches.length === 0
        ) {
            return;
        }

        const touch =
            event.touches[0];

        if (
            isInsideHeart(
                touch.clientX,
                touch.clientY
            )
        ) {

            createLoveBurst();

        }

    },
    {
        passive: true
    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            createLoveBurst();

        }

    }
);


/* =========================================================
   UPDATE
========================================================= */

function update(
    dt
) {

    pulseTime +=
        dt;

    clickBoost =
        Math.max(
            0,
            clickBoost -
            dt * 9
        );


    /* Floating hearts */

    spawnTimer +=
        dt;

    if (
        spawnTimer >
        0.35
    ) {

        spawnTimer = 0;

        floatingHearts.push(
            new FloatingHeart()
        );

    }


    for (
        const particle
        of particles
    ) {

        particle.update(
            dt
        );

    }

    particles =
        particles.filter(
            particle =>
                particle.life >
                0
        );


    for (
        const ripple
        of ripples
    ) {

        ripple.update(
            dt
        );

    }

    ripples =
        ripples.filter(
            ripple =>
                ripple.alive
        );


    for (
        const heart
        of floatingHearts
    ) {

        heart.update(
            dt
        );

    }

    floatingHearts =
        floatingHearts.filter(
            heart =>
                heart.alive
        );

}


/* =========================================================
   DRAW
========================================================= */

function draw() {

    drawBackground();


    /* Floating hearts */

    for (
        const heart
        of floatingHearts
    ) {

        heart.draw();

    }


    /* Ripples */

    for (
        const ripple
        of ripples
    ) {

        ripple.draw();

    }


    /* Main heart */

    drawMainHeart();


    /* Particles */

    for (
        const particle
        of particles
    ) {

        particle.draw();

    }

}


/* =========================================================
   ANIMATION LOOP
========================================================= */

function animate(
    now
) {

    const dt =
        Math.min(
            (
                now -
                lastTime
            ) / 1000,
            0.05
        );

    lastTime =
        now;

    update(
        dt
    );

    draw();

    requestAnimationFrame(
        animate
    );

}


/* =========================================================
   START
========================================================= */

requestAnimationFrame(
    animate
);

</script>

</body>
</html>
