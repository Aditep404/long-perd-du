<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>💗 LOVE</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:linear-gradient(#19081c,#5b103a);font-family:Tahoma,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%}.heart{position:fixed;left:50%;top:50%;width:180px;height:180px;transform:translate(-50%,-50%);filter:drop-shadow(0 0 22px #ff2868);animation:beat 1.35s infinite;cursor:pointer}.heart:before,.heart:after{content:"";position:absolute;top:20px;width:100px;height:155px;border-radius:60px 60px 0 0;background:linear-gradient(135deg,#ff9abd,#ff1e55 50%,#90052f)}.heart:before{left:75px;transform:rotate(45deg);transform-origin:0 100%}.heart:after{left:5px;transform:rotate(-45deg);transform-origin:100% 100%}@keyframes beat{0%,45%,100%{transform:translate(-50%,-50%) scale(1)}8%{transform:translate(-50%,-50%) scale(1.1)}16%{transform:translate(-50%,-50%) scale(1.02)}25%{transform:translate(-50%,-50%) scale(1.07)}}#msg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.5);opacity:0;color:#fff;font-size:clamp(48px,15vw,84px);font-weight:bold;text-shadow:0 0 12px #ff6496,0 0 35px #ff1e65;transition:.7s;pointer-events:none;white-space:nowrap}#msg.show{opacity:1;transform:translate(-50%,-50%) scale(1)}#hint{position:fixed;bottom:24px;width:100%;text-align:center;color:#ffdcea;opacity:.65;font-size:14px}</style></head><body><canvas id="c"></canvas><div class="heart" id="heart"></div><div id="msg">หวาน ❤️</div><div id="hint">แตะหัวใจ 💗</div><script>
const c=document.getElementById('c'),x=c.getContext('2d'),h=document.getElementById('heart'),m=document.getElementById('msg');let W,H,D,P=[],A=[],R=[],last=performance.now(),sp=0;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function heart(px,py,s){let p=new Path2D();for(let i=0;i<=80;i++){let t=i/80*Math.PI*2,X=px+16*Math.sin(t)**3*s,Y=py-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*s;i?p.lineTo(X,Y):p.moveTo(X,Y)}p.closePath();return p}const colors=['#ff376e','#ff6496','#ffa5c3','#ffdceb','#fff5fa'];
function burst(){let cx=W/2,cy=H/2;R.push({x:cx,y:cy,t:0});for(let i=0;i<95;i++){let a=Math.random()*6.28,v=80+Math.random()*310;P.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,s:4+Math.random()*9,l:.8+Math.random(),c:colors[Math.floor(Math.random()*colors.length)],r:Math.random()*6.28})}for(let i=0;i<35;i++){let a=Math.random()*6.28,v=180+Math.random()*380;P.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,s:1+Math.random()*2,l:.3+Math.random()*.5,spark:1})}m.classList.remove('show');void m.offsetWidth;m.classList.add('show')}
function ambient(){A.push({x:15+Math.random()*(W-30),y:H+30,s:3+Math.random()*7,v:18+Math.random()*45,t:0,l:8+Math.random()*7,w:5+Math.random()*20,p:Math.random()*6.28,c:colors[Math.floor(Math.random()*4)]})}
function loop(now){let dt=Math.min((now-last)/1000,.05);last=now;sp+=dt;if(sp>.35){sp=0;ambient()}x.clearRect(0,0,W,H);let g=x.createRadialGradient(W/2,H/2,10,W/2,H/2,Math.min(W,H)*.5);g.addColorStop(0,'rgba(255,20,90,.18)');g.addColorStop(1,'rgba(255,20,90,0)');x.fillStyle=g;x.fillRect(0,0,W,H);A.forEach(a=>{a.t+=dt;a.y-=a.v*dt;a.x+=Math.sin(a.t*1.5+a.p)*a.w*dt;let q=Math.max(0,Math.min(1,a.t,(a.l-a.t)/2));if(q&&a.y>-50){x.save();x.globalAlpha=q*.35;x.fillStyle=a.c;x.translate(a.x,a.y);x.scale(a.s/18,a.s/18);x.fill(heart(0,0,1));x.restore()}});A=A.filter(a=>a.t<a.l&&a.y>-70);R.forEach(r=>{r.t+=dt;let q=Math.min(r.t/.75,1);x.beginPath();x.arc(r.x,r.y,20+260*(1-(1-q)**3),0,6.28);x.strokeStyle=`rgba(255,140,180,${.6*(1-q)})`;x.lineWidth=Math.max(1,5*(1-q));x.stroke()});R=R.filter(r=>r.t<.75);P.forEach(p=>{p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=25*dt;p.r+=2*dt;let q=Math.max(0,p.l/(p.spark?.8:1.8));x.save();x.globalAlpha=q;if(p.spark){x.strokeStyle='#fff';x.lineWidth=2;let n=Math.hypot(p.vx,p.vy)||1;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(p.x+p.vx/n*8,p.y+p.vy/n*8);x.stroke()}else{x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.scale(p.s/18,p.s/18);x.fill(heart(0,0,1))}x.restore()});P=P.filter(p=>p.l>0);requestAnimationFrame(loop)}requestAnimationFrame(loop);h.addEventListener('pointerdown',e=>{e.preventDefault();burst();if(navigator.vibrate)navigator.vibrate([30,40,70])});addEventListener('keydown',e=>{if(e.code==='Space')burst()});</script></body></html>
